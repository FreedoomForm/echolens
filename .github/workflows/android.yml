name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Provision bundled neural models (download + quantize, ~850 MB)
        run: |
          mkdir -p app/src/main/assets/models
          BASE=https://huggingface.co/jegly/audio/resolve/main
          curl -sfL --retry 3 "$BASE/dit_model.tflite" -o app/src/main/assets/models/dit_model.tflite
          curl -sfL --retry 3 "$BASE/autoencoder_model.tflite" -o app/src/main/assets/models/autoencoder_model.tflite
          curl -sfL --retry 3 "$BASE/conditioners_float32.tflite" -o /tmp/conditioners_fp32.tflite
          pip install --quiet ai-edge-quantizer
          python3 tools/quantize_conditioner.py \
            --src /tmp/conditioners_fp32.tflite \
            --dst app/src/main/assets/models/conditioners_float32.tflite
          rm -f /tmp/conditioners_fp32.tflite
          ls -la app/src/main/assets/models/

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Determine artifact name
        id: vars
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "apk=Echolens-${GITHUB_REF_NAME}.apk" >> "$GITHUB_OUTPUT"
          else
            echo "apk=Echolens-${GITHUB_SHA::7}.apk" >> "$GITHUB_OUTPUT"
          fi

      - name: Rename APK
        run: mv app/build/outputs/apk/release/app-release.apk "${{ steps.vars.outputs.apk }}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.vars.outputs.apk }}
          path: ${{ steps.vars.outputs.apk }}

      - name: Create GitHub Release with APK
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.vars.outputs.apk }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
